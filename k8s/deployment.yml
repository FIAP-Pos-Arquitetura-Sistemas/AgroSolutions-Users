apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: users
  template:
    metadata:
      labels:
        app: users
    spec:
      containers:
      - name: users-api
        image: viniciusdelr/agrosolutions-users:v1 # Sua tag do Docker Hub
        ports:
        - containerPort: 8080
        env:
        - name: ConnectionStrings__DefaultConnection
          valueFrom:
            secretKeyRef:
              name: agro-db-secret
              key: connection-string
        - name: Jwt__Key
          valueFrom:
            secretKeyRef:
              name: agro-db-secret
              key: jwt-key
---
apiVersion: v1
kind: Service
metadata:
  name: users-service
spec:
  type: LoadBalancer # Gera o IP público para o MVP [cite: 55]
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: users